<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIA | Crear Cuenta de usuario </title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <!-- Contenido de la página de inicio de sesión -->
     <div class="login-card">
        <!--Encabezado Informativo-->
        <div class="login-header">
            <h1>Portal Academico</h1>
            <p>Cree su cuenta de usuario.</p>
     </div>
     <!-- Formulario de inicio de sesión -->
      <form action="#" method="POST">
        <!-- Campo de usuario o Correo Electronico-->
         <div class="form-group">
            <label for="usuario">Nombre</label>
            <input type="text" id="nombre" name ="nombre" class="form-control" placeholder ="Ej: nombre" required autocomplete="username">
         </div>
         <!-- Campo de apellido -->
         <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name ="apellido" class="form-control" placeholder ="Ej: apellido" required autocomplete="username">
         </div>
         <!-- tipo de documento -->
            <div class="form-group">
                <label for="tipo_documento">Tipo de Documento</label>
                <select id="tipo_documento" name="tipo_documento" class="form-control" required>
                    <option value="">Seleccione su tipo de documento</option>
                    <option value="dni">DNI</option>
                    <option value="pasaporte">Pasaporte</option>
                    <option value="carnet_extranjeria">Carnet de Extranjería</option>
                </select>
            </div>
         <!-- Campo de número de documento -->
            <div class="form-group">
                <label for="numero_documento">Número de Documento</label>
                <input type="text" id="numero_documento" name ="numero_documento" class="form-control" placeholder ="Ingrese su número de documento" required autocomplete="username">
            </div>
        <!-- Campo de correo electrónico -->
         <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name ="email" class="form-control" placeholder ="Ej: usuario@universidad.edu" required autocomplete="email">
         </div>
         <!-- campo curso-->
            <div class="form-group">
                <label for="curso">Curso</label>
                <select id="curso" name="curso" class="form-control" required>
                    <option value="">Seleccione su curso</option>
                    <option value="curso1">Desarrollo de Aplicaciones Web</option>
                    <option value="curso2">HTML, CSS Y JAVASCRIPT</option>
                    <option value="curso3">Programación Orientada a Objetos</option>
                    <option value="curso4">Base de Datos Mysql</option>
                </select>
            </div>
       
         <!-- Botón para enviar el formulario -->
          <button type="submit" class="btn-submit">Crear Cuenta</button>
      </form>
      <!-- Pie de página   -->
       <footer class="login-footer">
        <p>© 2025 Portal Academico. Todos los derechos reservados.</p>
       </footer>
</body>
</html>
